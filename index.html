
<!DOCTYPE html>
<html>

<head>
    <title>AI Sentiment Analyzer</title>

    <style>

        body {
            background: #0f172a;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 40px;
        }

        textarea {
            width: 70%;
            height: 120px;
            border-radius: 10px;
            padding: 15px;
            font-size: 18px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
        }

        .card {
            background: #1e293b;
            margin: 30px auto;
            padding: 20px;
            width: 70%;
            border-radius: 15px;
        }

        img {
            width: 300px;
            margin-top: 20px;
        }

    </style>

</head>

<body>

    <h1>🤖 AI Sentiment Analyzer</h1>

    <form method="POST">

        <textarea
            name="text"
            placeholder="Enter your text here..."
            required
        ></textarea>

        <br>

        <button type="submit">
            Analyze Sentiment
        </button>

    </form>

    {% if result %}

    <div class="card">

        <h2>Result</h2>

        <h3>
            Sentiment:
            {{ result.label }}
        </h3>

        <h3>
            Confidence:
            {{ result.score }}%
        </h3>

        <p>
            "{{ result.text }}"
        </p>

    </div>

    <img src="{{ url_for('static', filename='chart.png') }}">

    {% endif %}

    <div class="card">

        <h2>Recent History</h2>

        {% for item in history %}

        <p>
            {{ item.text }}
            →
            <b>{{ item.label }}</b>
        </p>

        {% endfor %}

    </div>

</body>

</html>
